version: '3.8'

services:
  db:
    image: postgres:15
    container_name: my_project_db
    restart: always
    environment:
      - POSTGRES_DB=recap
      - POSTGRES_USER=supermag
      - POSTGRES_PASSWORD=qwerty1234@#
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: my_django_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_NAME=recap
      - DB_USER=supermag
      - DB_PASSWORD=qwerty1234@#
      - DB_HOST=db

  frontend:
    build:
      context: ./frontend/Recapped
    container_name: my_front_end
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  postgres_data:
